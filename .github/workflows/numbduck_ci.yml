name: numbduck_ci

on:
  push:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Write version to __init__.py
      run: echo "__version__ = '0.0.1'" > numbduck/__init__.py
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest "numba==0.64.0" "duckdb==1.5.0" -e .
    - name: nm vs ctypes symbol check
      run: |
        python -c "
        import subprocess, ctypes
        from numbduck.utils import find_duckdb_shared_lib, load_duckdb

        lib_path = find_duckdb_shared_lib()
        print(f'shared lib: {lib_path}')

        # nm check (what Goykhman reported)
        result = subprocess.run(['nm', '-g', lib_path], capture_output=True, text=True)
        nm_symbols = result.stdout
        test_sym = 'duckdb_array_type_array_size'
        nm_found = test_sym in nm_symbols
        print(f'nm -g finds {test_sym}: {nm_found}')

        nm_exported = [l for l in nm_symbols.splitlines() if ' T _duckdb_' in l]
        print(f'nm -g exported duckdb_ symbol count: {len(nm_exported)}')
        if nm_exported:
            for s in nm_exported[:5]:
                print(f'  {s}')

        # ctypes check (what numbduck uses at runtime)
        lib = load_duckdb()
        ctypes_found = hasattr(lib, test_sym)
        print(f'ctypes/dlsym finds {test_sym}: {ctypes_found}')

        print()
        print(f'HYPOTHESIS: nm={nm_found}, ctypes={ctypes_found}')
        if not nm_found and ctypes_found:
            print('CONFIRMED: nm hides symbol but dlsym resolves it via RTLD_GLOBAL')
        elif nm_found and ctypes_found:
            print('BOTH VISIBLE: symbol is exported normally')
        elif not nm_found and not ctypes_found:
            print('BOTH HIDDEN: symbol truly unavailable')
        "
