name: numbduck_ci

on:
  push:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Write version to __init__.py
      run: echo "__version__ = '0.0.1'" > numbduck/__init__.py
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest "numba==0.64.0" "duckdb==1.5.0"
        pip install --no-deps -e .
    - name: Probe C++ mangled symbols and symbol table
      run: |
        python -c "
        import subprocess, os

        from numbduck.utils import find_duckdb_shared_lib
        lib_path = find_duckdb_shared_lib()
        print(f'=== {lib_path}')
        print()

        # 1. Total symbol counts by type
        print('--- nm symbol type breakdown ---')
        r = subprocess.run(['nm', '-g', lib_path], capture_output=True, text=True)
        lines = r.stdout.splitlines()
        print(f'  nm -g total lines: {len(lines)}')
        # Count by symbol type (T=text, U=undefined, D=data, etc)
        from collections import Counter
        types = Counter()
        for l in lines:
            parts = l.split()
            if len(parts) >= 2:
                types[parts[-2] if len(parts) == 3 else parts[0]] += 1
        for t, c in types.most_common(20):
            print(f'    {t}: {c}')
        print()

        # 2. All exported symbols (not just duckdb_)
        print('--- ALL nm -g exported text symbols (T) ---')
        text_syms = [l for l in lines if ' T ' in l]
        print(f'  text symbols: {len(text_syms)}')
        for s in text_syms[:50]:
            print(f'    {s.strip()}')
        print()

        # 3. Search for mangled C++ DuckDB symbols
        print('--- Mangled C++ duckdb symbols (nm -g) ---')
        mangled = [l for l in lines if 'duckdb' in l.lower() or 'DuckDB' in l]
        print(f'  matches: {len(mangled)}')
        for s in mangled[:30]:
            print(f'    {s.strip()}')
        print()

        # 4. nm without -g (all symbols, not just global)
        print('--- nm (no flags) total ---')
        r = subprocess.run(['nm', lib_path], capture_output=True, text=True)
        all_lines = r.stdout.splitlines()
        print(f'  total lines: {len(all_lines)}')
        print(f'  stderr: {r.stderr.strip()[:200]}')
        # Search for duckdb in all symbols
        all_duckdb = [l for l in all_lines if 'duckdb' in l.lower() or 'DuckDB' in l]
        print(f'  duckdb matches (all vis): {len(all_duckdb)}')
        for s in all_duckdb[:30]:
            print(f'    {s.strip()}')
        print()

        # 5. nm -a (include debug symbols)
        print('--- nm -a total ---')
        r = subprocess.run(['nm', '-a', lib_path], capture_output=True, text=True)
        a_lines = r.stdout.splitlines()
        print(f'  total lines: {len(a_lines)}')
        a_duckdb = [l for l in a_lines if 'duckdb' in l.lower() or 'DuckDB' in l]
        print(f'  duckdb matches: {len(a_duckdb)}')
        for s in a_duckdb[:30]:
            print(f'    {s.strip()}')
        print()

        # 6. objdump -t (full symbol table)
        print('--- objdump -t (symbol table) ---')
        r = subprocess.run(['objdump', '-t', lib_path], capture_output=True, text=True)
        obj_lines = r.stdout.splitlines()
        print(f'  total lines: {len(obj_lines)}')
        obj_duckdb = [l for l in obj_lines if 'duckdb' in l.lower() or 'DuckDB' in l]
        print(f'  duckdb matches: {len(obj_duckdb)}')
        for s in obj_duckdb[:30]:
            print(f'    {s.strip()}')
        print()

        # 7. Demangle any C++ symbols we find
        print('--- Demangled duckdb symbols ---')
        if mangled or all_duckdb:
            syms_to_demangle = list(set(mangled + all_duckdb))[:50]
            # Extract symbol names
            names = []
            for l in syms_to_demangle:
                parts = l.strip().split()
                if parts:
                    names.append(parts[-1])
            if names:
                input_text = chr(10).join(names)
                r = subprocess.run(['c++filt'], input=input_text,
                                   capture_output=True, text=True)
                for orig, demangled in zip(names, r.stdout.splitlines()):
                    if orig != demangled:
                        print(f'    {demangled}')
                    else:
                        print(f'    {orig} (not mangled)')
        print()

        # 8. Search for PyInit (the module entry point) - this MUST be exported
        print('--- PyInit symbols ---')
        pyinit = [l for l in lines if 'PyInit' in l]
        print(f'  PyInit symbols: {len(pyinit)}')
        for s in pyinit:
            print(f'    {s.strip()}')
        print()

        # 9. Compare: how many symbols does duckdb 1.4.0 have on the same platform?
        #    (We can't install both, but check what our .so reports)
        print('--- Binary section sizes ---')
        r = subprocess.run(['size', '-m', lib_path], capture_output=True, text=True)
        print(f'  {r.stdout.strip()[:1000]}')
        "
