name: numbduck_ci

on:
  push:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Write version to __init__.py
      run: echo "__version__ = '0.0.1'" > numbduck/__init__.py
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest "numba==0.64.0" "duckdb==1.5.0"
        pip install --no-deps -e .
    - name: Probe hidden symbols
      run: |
        python -c "
        import ctypes, ctypes.util, sys, os, types

        from numbduck.utils import find_duckdb_shared_lib
        lib_path = find_duckdb_shared_lib()
        test_syms = ['duckdb_open', 'duckdb_query', 'duckdb_array_type_array_size']
        print(f'=== shared lib: {lib_path}')
        print()

        # 1. Import duckdb, then try RTLD_DEFAULT for our symbols
        #    Loading the .so into the process might make symbols resolvable
        import duckdb
        import _duckdb
        print(f'duckdb version: {duckdb.__version__}')
        print(f'duckdb.__file__: {duckdb.__file__}')
        print(f'_duckdb module: {_duckdb}')
        print(f'_duckdb.__file__: {getattr(_duckdb, \"__file__\", \"N/A\")}')
        print()

        print('--- dlsym(RTLD_DEFAULT) after import _duckdb ---')
        try:
            default = ctypes.CDLL(None)  # RTLD_DEFAULT
            for sym in test_syms:
                print(f'  {sym}: {hasattr(default, sym)}')
        except Exception as e:
            print(f'  failed: {e}')
        print()

        # 2. Check for PyCapsule objects in duckdb / _duckdb
        print('--- PyCapsule search in duckdb and _duckdb ---')
        for mod_name, mod in [('duckdb', duckdb), ('_duckdb', _duckdb)]:
            capsules = []
            for attr_name in dir(mod):
                try:
                    obj = getattr(mod, attr_name)
                    tp = type(obj).__name__
                    if 'capsule' in tp.lower() or 'PyCapsule' in tp:
                        capsules.append(attr_name)
                except:
                    pass
            print(f'  {mod_name} capsules: {capsules if capsules else \"none\"}')

            # Also check for _C, _lib, _handle, ffi patterns
            interesting = []
            for attr_name in dir(mod):
                if any(p in attr_name.lower() for p in ['_c_', 'capi', 'c_api', '_lib', '_handle', 'ffi', 'native', 'capsule', '_dll']):
                    interesting.append(attr_name)
            if interesting:
                print(f'  {mod_name} interesting attrs: {interesting}')
        print()

        # 3. Inspect _duckdb module attributes exhaustively
        print('--- _duckdb module dir() ---')
        for attr_name in sorted(dir(_duckdb)):
            obj = getattr(_duckdb, attr_name, None)
            tp = type(obj).__name__
            print(f'  {attr_name}: {tp}')
        print()

        # 4. Check if duckdb exposes a connection's internal pointer
        print('--- duckdb.connect() object internals ---')
        conn = duckdb.connect(':memory:')
        print(f'  type: {type(conn)}')
        print(f'  dir: {[a for a in dir(conn) if not a.startswith(\"__\")]}')
        # Check for C-level pointer attributes
        for attr in ['_conn', '_connection', 'c_ptr', '_handle', '_native']:
            if hasattr(conn, attr):
                print(f'  {attr}: {getattr(conn, attr)}')
        conn.close()
        print()

        # 5. Inspect the C function pointers behind Python builtins
        #    PyCFunctionObject has ml_meth (the C func pointer)
        print('--- C function pointer inspection ---')
        # duckdb.connect is a builtin_function_or_method or similar
        connect_func = duckdb.connect
        print(f'  duckdb.connect type: {type(connect_func).__name__}')
        print(f'  duckdb.connect __module__: {getattr(connect_func, \"__module__\", \"?\")}')

        # Try to get the raw C function pointer via ctypes
        # PyCFunctionObject layout: ob_refcnt, ob_type, m_ml, m_self, m_module, ...
        # PyMethodDef layout: ml_name (char*), ml_meth (func ptr), ml_flags (int), ml_doc (char*)
        ptr_size = ctypes.sizeof(ctypes.c_void_p)
        print(f'  pointer size: {ptr_size}')
        print()

        # 6. Check if duckdb has a way to get the library path or handle
        print('--- duckdb library_version and internal paths ---')
        if hasattr(duckdb, 'library_version'):
            print(f'  library_version: {duckdb.library_version()}')
        # Check for source_id, build info etc
        for attr in ['source_id', 'library_version', 'platform', '__loader__']:
            if hasattr(duckdb, attr):
                val = getattr(duckdb, attr)
                if callable(val):
                    try:
                        val = val()
                    except:
                        pass
                print(f'  duckdb.{attr}: {val}')
        print()

        # 7. Try loading _duckdb .so with RTLD_GLOBAL and re-check
        print('--- reload _duckdb.so with RTLD_GLOBAL ---')
        duckdb_ext_path = getattr(_duckdb, '__file__', None)
        if duckdb_ext_path:
            print(f'  _duckdb path: {duckdb_ext_path}')
            try:
                lib = ctypes.CDLL(duckdb_ext_path, mode=ctypes.RTLD_GLOBAL)
                for sym in test_syms:
                    print(f'  {sym}: {hasattr(lib, sym)}')
                # Also check what IS available
                available = []
                for attr in dir(lib):
                    if 'duckdb' in attr.lower():
                        available.append(attr)
                print(f'  available duckdb attrs on CDLL: {available[:20]}')
            except Exception as e:
                print(f'  failed: {e}')
        print()

        # 8. Look for shared libs loaded in the process
        print('--- loaded dylibs (from sysctl/dyld) ---')
        import subprocess
        # macOS: use vmmap or dyld_info on the process
        r = subprocess.run(['bash', '-c',
            'for f in /proc/self/maps; do cat \"$f\" 2>/dev/null; done; '
            'vmmap $$ 2>/dev/null | grep -i duckdb | head -5; '
            'echo DYLD_PRINT; '
            'otool -L \"' + lib_path + '\" | head -20'
        ], capture_output=True, text=True)
        print(f'  {r.stdout.strip()[:2000]}')
        if r.stderr.strip():
            print(f'  stderr: {r.stderr.strip()[:500]}')
        print()

        # 9. otool -L to see what the .so links against
        print('--- otool -L (linked libraries) ---')
        r = subprocess.run(['otool', '-L', lib_path], capture_output=True, text=True)
        print(f'  {r.stdout.strip()}')
        "
