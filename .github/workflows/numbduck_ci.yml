name: numbduck_ci

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    strategy:
      matrix:
        python-version: [ "3.11"]
        arch: ["windows-latest"]
        numba-version: ["0.68.0", "0.68.1"]
        duckdb-version: ["1.5.1"]
    runs-on: "${{ matrix.arch }}"

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "${{ matrix.python-version }}"
    - name: Determine version
      shell: bash
      id: version
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        if [ "${REF_TYPE}" = "tag" ]; then
          printf 'VERSION=%s\n' "${REF_NAME}" >> "$GITHUB_ENV"
        else
          BUILD_VERSION="0.1.${RUN_NUMBER}"
          printf 'VERSION=%s\n' "${BUILD_VERSION}" >> "$GITHUB_ENV"
        fi
    - name: Write version to __init__.py
      shell: bash
      run: |
        python - <<'PY'
        import os
        import pathlib

        pathlib.Path("numbduck/__init__.py").write_text(
            f"__version__ = {os.environ['VERSION']!r}\n", encoding="utf-8")
        PY
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        pip install "numba==${{ matrix.numba-version }}"
        pip install "duckdb==${{ matrix.duckdb-version }}"
        pip install -e .
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --exclude=test/core/random_image_ref.py --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest test/test_no_cache_location.py -rs -v
    - name: Install build dependencies
      run: |
        pip install build==1.2.2.post1 wheel==0.45.0
    - name: Build wheel
      run: |
        git clean -Xfd
        python -m build --wheel
