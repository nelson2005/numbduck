name: numbduck_ci

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14"]
        arch: ["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest"]
        numba-version: ["0.60.0", "0.64.0"]
        duckdb-version: ["1.3.2", "1.4.0", "1.5.1"]
        exclude:
          # numba 0.60.0 does not support Python 3.13
          - python-version: "3.13"
            numba-version: "0.60.0"
          # numba 0.60.0 does not support Python 3.14
          - python-version: "3.14"
            numba-version: "0.60.0"
          # Windows only on Python 3.11 + latest duckdb to reduce billable minutes
          - python-version: "3.10"
            arch: "windows-latest"
          - python-version: "3.12"
            arch: "windows-latest"
          - python-version: "3.13"
            arch: "windows-latest"
          - arch: "windows-latest"
            duckdb-version: "1.3.2"
          - arch: "windows-latest"
            duckdb-version: "1.4.0"
        include:
          # The struct-by-value ABI (by-pointer args, sret returns) diverges
          # most on Windows, and the base matrix runs Windows only at the
          # latest duckdb. Add a single job so the lower bound of the supported
          # duckdb range is exercised at least once on that divergent ABI.
          - python-version: "3.11"
            arch: "windows-latest"
            numba-version: "0.64.0"
            duckdb-version: "1.3.2"
    runs-on: "${{ matrix.arch }}"

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "${{ matrix.python-version }}"
    - name: Determine version
      shell: bash
      id: version
      run: |
        if [ "${{ github.ref_type }}" == "tag" ]; then
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
        else
          BUILD_VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=${BUILD_VERSION}" >> $GITHUB_ENV
        fi
    - name: Write version to __init__.py
      shell: bash
      run: echo "__version__ = '${{ env.VERSION }}'" > numbduck/__init__.py
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        pip install "numba==${{ matrix.numba-version }}"
        pip install "duckdb==${{ matrix.duckdb-version }}"
        # numbduck imports deep numbox internals, so pin the validated numbox
        # rather than let pip resolve an arbitrary latest through the range cap.
        pip install "numbox==0.5.23"
        pip install -e .
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest --durations=20
    - name: Install build dependencies
      run: |
        pip install build==1.2.2.post1 wheel==0.45.0
    - name: Build wheel
      run: |
        git clean -Xfd
        python -m build --wheel

  macos:

    # The duckdb macOS wheels omit the C API symbols numbduck's JIT bindings
    # need (across the 1.4.1..1.5.2 wheels), so on macOS numbduck acquires a
    # standalone libduckdb and refuses one whose version disagrees with the
    # installed wheel. Pin a wheel in that range and let the loader download the
    # version-matched standalone; this is the only job that exercises the macOS
    # library acquisition and version-coordination paths in numbduck/utils.py.
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Determine version
      shell: bash
      id: version
      run: |
        if [ "${{ github.ref_type }}" == "tag" ]; then
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
        else
          BUILD_VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=${BUILD_VERSION}" >> $GITHUB_ENV
        fi
    - name: Write version to __init__.py
      shell: bash
      run: echo "__version__ = '${{ env.VERSION }}'" > numbduck/__init__.py
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install "numba==0.64.0"
        pip install "duckdb==1.5.1"
        # numbduck imports deep numbox internals, so pin the validated numbox
        # rather than let pip resolve an arbitrary latest through the range cap.
        pip install "numbox==0.5.23"
        pip install -e .
    - name: Test with pytest
      env:
        # macOS wheels lack the C API symbols, so let the loader fetch the
        # version-matched standalone libduckdb without the interactive prompt.
        NUMBDUCK_LIBDUCKDB_DOWNLOAD: "1"
      run: |
        pytest --durations=20
