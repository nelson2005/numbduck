name: numbduck_ci

on:
  push:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Write version to __init__.py
      run: echo "__version__ = '0.0.1'" > numbduck/__init__.py
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest "numba==0.64.0" "duckdb==1.5.0"
        pip install --no-deps -e .
    - name: Probe pybind11 conduit and C++ pointers
      run: |
        python -c "
        import ctypes, sys

        import duckdb
        import _duckdb

        print(f'duckdb {duckdb.__version__}')
        print()

        conn = duckdb.connect(':memory:')

        # 1. Explore _pybind11_conduit_v1_
        print('--- _pybind11_conduit_v1_ ---')
        conduit = getattr(conn, '_pybind11_conduit_v1_', None)
        print(f'  conduit method: {conduit}')
        print(f'  type: {type(conduit)}')
        if conduit:
            # pybind11 conduit signature: _pybind11_conduit_v1_(type_handle, capsule_name)
            # Try calling with various args to see what it returns
            for args in [
                (),
                (None,),
                (b'',),
            ]:
                try:
                    result = conduit(*args)
                    print(f'  conduit{args} -> {result} (type={type(result).__name__})')
                except Exception as e:
                    print(f'  conduit{args} -> ERROR: {e}')
        print()

        # 2. Try pybind11 detail: get the type_info for DuckDBPyConnection
        print('--- pybind11 internals via sys.modules ---')
        for key in sorted(sys.modules):
            if 'pybind' in key.lower():
                print(f'  {key}: {sys.modules[key]}')
        print()

        # 3. Use ctypes to read the pybind11 object's C++ pointer
        #    pybind11 objects have layout: PyObject_HEAD + value_and_holder
        #    On 64-bit: [ob_refcnt(8)] [ob_type(8)] [instance data...]
        #    The C++ pointer is typically at offset 16 or in the holder
        print('--- Raw memory inspection of DuckDBPyConnection ---')
        conn_id = id(conn)
        ptr_size = ctypes.sizeof(ctypes.c_void_p)
        print(f'  conn id (address): {hex(conn_id)}')
        print(f'  conn.__sizeof__(): {conn.__sizeof__()}')
        print(f'  sys.getsizeof(conn): {sys.getsizeof(conn)}')

        # Read memory at conn's address - pybind11 instance layout:
        # PyObject_HEAD (refcnt + type = 16 bytes on 64-bit)
        # then pybind11::detail::instance which has:
        #   PyObject_HEAD already counted
        #   bool owned : 1
        #   bool holder_constructed : 1
        #   ... padding
        #   value_and_holder: contains the C++ pointer
        #
        # Let's dump the first ~128 bytes to see the layout
        print(f'  first 128 bytes at conn address:')
        for offset in range(0, 128, 8):
            val = ctypes.c_uint64.from_address(conn_id + offset).value
            print(f'    +{offset:3d}: {hex(val)} ({val})')
        print()

        # 4. Try to identify the C++ pointer by comparison
        #    Create two connections and see which fields differ
        print('--- Compare two connections to find instance pointer ---')
        conn2 = duckdb.connect(':memory:')
        conn2_id = id(conn2)
        print(f'  conn2 address: {hex(conn2_id)}')
        diffs = []
        for offset in range(0, 128, 8):
            v1 = ctypes.c_uint64.from_address(conn_id + offset).value
            v2 = ctypes.c_uint64.from_address(conn2_id + offset).value
            if v1 != v2:
                diffs.append((offset, v1, v2))
                print(f'  +{offset:3d}: {hex(v1)} vs {hex(v2)} (DIFFER)')
            else:
                print(f'  +{offset:3d}: {hex(v1)} (same)')
        print()

        # 5. The differing pointer fields are candidates for the C++ object ptr
        #    Try using the first non-refcount differing field as duckdb_connection
        print('--- Candidate C++ pointers ---')
        for offset, v1, v2 in diffs:
            if offset == 0:  # skip refcount
                continue
            print(f'  offset +{offset}: {hex(v1)}, {hex(v2)}')
            # Sanity: is this a valid heap pointer? (high bits set on macOS ARM64)
            if v1 > 0x100000000 and v2 > 0x100000000:
                print(f'    looks like heap pointers')
        print()

        # 6. Check if DuckDB's Python connection exposes internal handles
        #    via any property or hidden method
        print('--- All attributes of conn including private ---')
        for attr in sorted(dir(conn)):
            try:
                val = getattr(conn, attr)
                tp = type(val).__name__
                # Show non-method attributes that might be pointers
                if not callable(val) or 'built' not in tp:
                    print(f'  {attr}: {tp} = {repr(val)[:100]}')
            except Exception as e:
                print(f'  {attr}: ERROR {e}')
        print()

        # 7. Run a query and inspect the result object too
        print('--- Query result object ---')
        result = conn.execute('SELECT 42 as answer')
        result_id = id(result)
        print(f'  result type: {type(result)}')
        print(f'  result address: {hex(result_id)}')
        print(f'  result.__sizeof__(): {result.__sizeof__()}')
        # Dump first 128 bytes
        for offset in range(0, 128, 8):
            val = ctypes.c_uint64.from_address(result_id + offset).value
            print(f'    +{offset:3d}: {hex(val)}')
        print()

        conn2.close()
        conn.close()
        print('DONE')
        "
