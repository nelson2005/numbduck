name: numbduck_ci

on:
  push:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    strategy:
      matrix:
        python-version: ["3.12"]
        arch: ["macos-latest"]
        numba-version: ["0.64.0"]
        duckdb-version: ["1.4.0", "1.4.1", "1.5.0", "1.5.1"]
    runs-on: "${{ matrix.arch }}"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "${{ matrix.python-version }}"
    - name: Determine version
      shell: bash
      id: version
      run: |
        if [ "${{ github.ref_type }}" == "tag" ]; then
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
        else
          BUILD_VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=${BUILD_VERSION}" >> $GITHUB_ENV
        fi
    - name: Write version to __init__.py
      shell: bash
      run: echo "__version__ = '${{ env.VERSION }}'" > numbduck/__init__.py
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        pip install "numba==${{ matrix.numba-version }}"
        pip install "duckdb==${{ matrix.duckdb-version }}"
        pip install -e .
    - name: Check symbol exports
      run: |
        python -c "
        from numbduck.utils import load_duckdb
        lib = load_duckdb()
        symbols = ['duckdb_open', 'duckdb_connect', 'duckdb_query', 'duckdb_array_type_array_size']
        for s in symbols:
            print(f'{s}: {hasattr(lib, s)}')
        "
    - name: Test with pytest
      run: |
        pytest
