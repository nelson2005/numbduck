name: darwin poison-on-free probe

on:
  push:
    branches: [ "ci/darwin-poison-probe" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-source: "setup-python"
            python-version: "3.12"
          - python-source: "homebrew"
            python-version: "3.12"
          - python-source: "conda"
            python-version: "3.12"
    runs-on: macos-latest
    env:
      NUMBDUCK_LIBDUCKDB_DOWNLOAD: "1"
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Set up Python (setup-python)
      if: matrix.python-source == 'setup-python'
      uses: actions/setup-python@v6
      with:
        python-version: "${{ matrix.python-version }}"
    - name: Set up Python (conda-forge)
      if: matrix.python-source == 'conda'
      run: |
        curl -fsSL https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-MacOSX-arm64.sh -o miniforge.sh
        bash miniforge.sh -b -p $HOME/miniforge
        $HOME/miniforge/bin/conda create -n test python=${{ matrix.python-version }} -y
        echo "$HOME/miniforge/envs/test/bin" >> $GITHUB_PATH
    - name: Set up Python (Homebrew)
      if: matrix.python-source == 'homebrew'
      run: |
        brew install python@${{ matrix.python-version }}
        brew link --overwrite python@${{ matrix.python-version }}
        /opt/homebrew/opt/python@${{ matrix.python-version }}/bin/python${{ matrix.python-version }} -m venv venv
        echo "$PWD/venv/bin" >> $GITHUB_PATH
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e . pytest
        python -c "import os, sys, duckdb, numba, numbox; print(os.path.realpath(sys.executable), sys.version.split()[0], 'duckdb', duckdb.__version__, 'numba', numba.__version__, 'numbox', numbox.__version__)"
        python -c "import sysconfig; print('CONFIG_ARGS', sysconfig.get_config_var('CONFIG_ARGS')); print('LDFLAGS', sysconfig.get_config_var('LDFLAGS')); print('PY_CFLAGS', sysconfig.get_config_var('PY_CFLAGS'))"
        otool -L "$(python -c 'import os, sys; print(os.path.realpath(sys.executable))')" || true
    - name: Build the interposing allocator
      run: |
        cat > poison_free.c <<'C'
        #include <malloc/malloc.h>
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>

        static void poison_free(void *p) {
            if (p) {
                size_t n = malloc_size(p);
                if (n > 0 && n < 4096) memset(p, 0xDE, n);
            }
            free(p);
        }

        __attribute__((used)) static struct { const void *replacement; const void *replacee; }
        _interpose_free __attribute__((section("__DATA,__interpose"))) = {
            (const void *)poison_free, (const void *)free
        };

        __attribute__((constructor)) static void poison_free_loaded(void) {
            fputs("poison_free loaded\n", stderr);
        }
        C
        cc -Wall -Wextra -dynamiclib -O2 -o poison_free.dylib poison_free.c
    - name: Which frees are poisoned, per path and per environment
      run: |
        cat > freed.py <<'PY'
        import ctypes
        import numpy
        from numba import njit

        def peek(addr):
            return bytes((ctypes.c_ubyte * 16).from_address(addr + 32)).hex()

        libc = ctypes.CDLL(None)
        libc.malloc.restype = ctypes.c_void_p
        libc.malloc.argtypes = [ctypes.c_size_t]
        libc.free.argtypes = [ctypes.c_void_p]
        p = libc.malloc(96)
        ctypes.memset(p, 0x11, 96)
        libc.free(p)
        print("libc malloc/free       ", peek(p))

        api = ctypes.pythonapi
        api.PyMem_RawMalloc.restype = ctypes.c_void_p
        api.PyMem_RawMalloc.argtypes = [ctypes.c_size_t]
        api.PyMem_RawFree.argtypes = [ctypes.c_void_p]
        p = api.PyMem_RawMalloc(96)
        ctypes.memset(p, 0x11, 96)
        api.PyMem_RawFree(p)
        print("PyMem_RawMalloc/RawFree", peek(p))

        @njit
        def fill_and_drop():
            a = numpy.empty(8, numpy.int64)
            for i in range(8):
                a[i] = 0x1111111111111111
            return a.ctypes.data

        addr = fill_and_drop()
        print("numba array            ", peek(addr))
        PY
        for variant in "" "MallocZeroOnFree=0" "MallocScribble=1" "MallocScribble=1 MallocZeroOnFree=0" "MallocScribble=1 MallocNanoZone=0" "DYLD_INSERT_LIBRARIES=$PWD/poison_free.dylib" "DYLD_INSERT_LIBRARIES=$PWD/poison_free.dylib MallocZeroOnFree=0"; do
          echo "== env: ${variant:-plain}"
          env $variant python freed.py 2>&1 || true
        done
        echo "== the system python, plain and under MallocZeroOnFree=0 MallocScribble=1"
        /usr/bin/python3 -c "import ctypes; libc = ctypes.CDLL(None); libc.malloc.restype = ctypes.c_void_p; libc.malloc.argtypes = [ctypes.c_size_t]; libc.free.argtypes = [ctypes.c_void_p]; p = libc.malloc(96); ctypes.memset(p, 0x11, 96); libc.free(p); print(bytes((ctypes.c_ubyte * 16).from_address(p + 32)).hex())" || true
        MallocZeroOnFree=0 MallocScribble=1 /usr/bin/python3 -c "import ctypes; libc = ctypes.CDLL(None); libc.malloc.restype = ctypes.c_void_p; libc.malloc.argtypes = [ctypes.c_size_t]; libc.free.argtypes = [ctypes.c_void_p]; p = libc.malloc(96); ctypes.memset(p, 0x11, 96); libc.free(p); print(bytes((ctypes.c_ubyte * 16).from_address(p + 32)).hex())" || true
    - name: The revised tests
      run: pytest -rs -v --durations=5 test/test_ducklib.py::test_jit_destroy_calls_read_no_freed_buffer test/test_ducklib.py::test_binding_called_from_python_lets_duckdb_workers_take_the_gil
    - name: Check out the pre-fix tree
      run: git worktree add "$RUNNER_TEMP/prefix" c59b049d0296c252819d67cba00e4206938d58bd
    - name: The pre-fix tree under scribbling, with and without zero-on-free
      working-directory: ${{ runner.temp }}/prefix
      run: |
        PYTHONPATH=$PWD python -c "import numbduck; print(numbduck.__file__)"
        for variant in "MallocScribble=1" "MallocScribble=1 MallocZeroOnFree=0"; do
          set +e
          env $variant PYTHONPATH=$PWD python -m pytest -q -p no:cacheprovider test/test_ducklib.py::test_jit_open_close_database test/test_ducklib.py::test_jit_connect_query_disconnect test/test_ducklib.py::test_jit_query_invalid_sql test/test_ducklib.py::test_jit_prepare_bind_execute test/test_ducklib.py::test_online_scoring_missing_key_raises test/test_ducklib.py::test_online_scoring_null_feature_raises > out.txt 2>&1
          rc=$?
          set -e
          echo "== $variant: exit=$rc"; head -3 out.txt; tail -2 out.txt
        done
